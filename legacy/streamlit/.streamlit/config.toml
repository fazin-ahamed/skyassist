[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#005F61"
backgroundColor = "#F7F6F1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#122C30"
font = "sans serif"
