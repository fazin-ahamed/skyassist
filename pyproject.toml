[project]
name = "skyassist"
version = "0.1.0"
description = "SkyAssist passenger connection agent (competition build)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "segno>=1.6",
  "tzdata",
  "websockets>=14",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100"]
legacy = ["streamlit>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["skyassist*"]
